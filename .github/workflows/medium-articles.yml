name: Update Latest Blog Posts

on:
  schedule:
    # 매일 자정(UTC)에 업데이트
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update README from blog RSS
        run: |
          python3 - <<'EOF'
          import re, urllib.request, xml.etree.ElementTree as ET
          from email.utils import parsedate_to_datetime

          FEED = "https://jungkwan.pages.dev/rss.xml"
          req = urllib.request.Request(FEED, headers={"User-Agent": "Mozilla/5.0 (readme-updater)"})
          root = ET.fromstring(urllib.request.urlopen(req, timeout=30).read())
          items = sorted(root.iter("item"),
                         key=lambda i: parsedate_to_datetime(i.findtext("pubDate")),
                         reverse=True)[:3]
          lines = [
              f"- [{i.findtext('title').strip()}]({i.findtext('link').strip()}) — "
              f"{parsedate_to_datetime(i.findtext('pubDate')):%Y-%m-%d}"
              for i in items
          ]

          with open("README.md", encoding="utf-8") as f:
              readme = f.read()
          block = "<!-- BLOG:START -->\n" + "\n".join(lines) + "\n<!-- BLOG:END -->"
          readme = re.sub(r"<!-- BLOG:START -->.*?<!-- BLOG:END -->", lambda _: block, readme, flags=re.S)
          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme)
          EOF

      - name: Commit changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --cached --quiet || (git commit -m 'Update latest blog posts' && git push)
